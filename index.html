<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1{
        text-align: center;
    }
    body{
        background-color: rgb(220, 163, 173);
        color: whitesmoke;
        font-size: xx-large;
        padding: 100px;
        justify-content: center;
      
    }
    input{
        font-size: medium;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        color: rgb(77, 62, 62);
        
    }
    #bu{
        border-radius: 1000px;
        height: 1cm;
        width: 2cm;
       
    }
    #tx{
        border-radius: 100px;
        border-color: palevioletred;
        height: 1cm;
    }
   
</style>
<body>
    <h1><B>TO DO LIST</B></h1>
    <label>Task name : <input id="tx" type="text"></label>
    <input id="bu" type="button" value="addTask" onclick="addTask()">
    <div id="parent"></div>
    <script>
        let parent=document.querySelector('#parent');
        let td=document.querySelector('input');
        function addTask()
            {
                if(td.value!=""){
                let task=document.createElement('p');
                task.textContent=td.value;
                 let delbutton=document.createElement('button');
                 delbutton.textContent="🙅‍♀️";
                 delbutton.onclick=function(){
                    parent.removeChild(task);
                 };
                 let state=document.createElement('input');
                 state.setAttribute('type','checkbox');
                  parent.appendChild(task);
                  task.appendChild(state);
                  td.value="";//to clear 
                task.appendChild(delbutton);
                }
                else{
                    alert("please enter something🥹");
                }  
             
            }
    </script>
</body>
</html>
